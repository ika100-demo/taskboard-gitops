apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-api
  labels:
    app: task-api
    app.kubernetes.io/name: task-api
    app.kubernetes.io/part-of: taskboard
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - task-api.taskboard-staging.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: task-api
      port: 80
